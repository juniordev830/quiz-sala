name: Validar Elixir
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Testar sala original
        run: docker run --rm -v "$PWD:/work" -w /work elixir:1.18@sha256:16382709b3765b946748714575d8748ea7dcb7cb9a4849730bcdc56533503691 elixir main.exs --self-test
      - name: Testar torneio, relatórios e concorrência
        run: docker run --rm -v "$PWD:/work" -w /work elixir:1.18@sha256:16382709b3765b946748714575d8748ea7dcb7cb9a4849730bcdc56533503691 elixir tournament_test.exs
